name: Verify and finish security remediation
on:
  push:
    branches: [codex/security-audit-2026-10-30]
    paths: [.github/workflows/codex-security-finish.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      npm_config_ignore_scripts: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Apply targeted security updates
        run: |
          node - <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          function npm(args){const r=cp.spawnSync('npm',args,{encoding:'utf8',timeout:240000,maxBuffer:20*1024*1024});if(r.status!==0){console.log(r.stdout+r.stderr);throw new Error('npm failed');}return r.stdout;}
          function version(s){const a=JSON.parse(npm(['view',s,'version','--json']));return Array.isArray(a)?a.at(-1):a;}
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          if(p.dependencies?.['react-router-dom'])p.dependencies['react-router-dom']=version('react-router-dom@7');
          if(p.name==='frontend_developer_junior_test'){p.dependencies.vite=version('vite@6');p.dependencies['vite-plugin-svgr']=version('vite-plugin-svgr@4');}
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          npm(['install','--package-lock-only','--ignore-scripts','--no-audit','--no-fund']);
          const a=cp.spawnSync('npm',['audit','--json'],{encoding:'utf8',timeout:120000,maxBuffer:12*1024*1024});const r=JSON.parse(a.stdout);
          console.log('FINAL_AUDIT',JSON.stringify(r.metadata?.vulnerabilities??r.error));for(const [name,v]of Object.entries(r.vulnerabilities||{}))console.log('REMAINING',JSON.stringify({name,severity:v.severity,via:v.via}));
          cp.execFileSync('git',['add','package.json','package-lock.json']);
          cp.execFileSync('git',['config','user.name','github-actions[bot]']);cp.execFileSync('git',['config','user.email','41898282+github-actions[bot]@users.noreply.github.com']);
          if(cp.spawnSync('git',['diff','--cached','--quiet']).status!==0){cp.execFileSync('git',['-c','core.hooksPath=/dev/null','commit','-m','fix: update vulnerable router and development server'],{stdio:'inherit'});cp.execFileSync('git',['push','origin','HEAD:codex/security-audit-2026-10-30'],{stdio:'inherit'});}
          NODE
      - name: Install, test, and build
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run test --if-present
          npm run build
      - name: Verify real browser rendering and navigation
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
          npm run preview -- --host 127.0.0.1 --port 3100 > /tmp/security-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          node - <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
           const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
           const page=await browser.newPage({ignoreHTTPSErrors:true});
           const errors=[];page.on('pageerror',e=>errors.push(e.message));
           const origin=process.env.SECURITY_PREVIEW_ORIGIN || 'http://127.0.0.1:3100';
           await page.goto(origin,{waitUntil:'domcontentloaded',timeout:60000});
           await page.locator('#root > *').first().waitFor({state:'attached',timeout:15000});
           await page.waitForTimeout(1000);
           if(!(await page.locator('#root').innerHTML()).trim())throw new Error('The application root is empty');
           const routes=await page.locator('a[href]').evaluateAll(nodes=>[...new Set(nodes.map(n=>n.href).filter(x=>x.startsWith(location.origin+'/')))].slice(0,8));
           for(const route of routes){await page.goto(route,{waitUntil:'domcontentloaded',timeout:60000});await page.locator('#root > *').first().waitFor({state:'attached',timeout:15000});await page.waitForTimeout(500);if(!(await page.locator('#root').innerHTML()).trim())throw new Error('Empty route '+route);}
           console.log('BROWSER_SMOKE',JSON.stringify({routes:routes.length+1,errors}));
           await browser.close();if(errors.length)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
